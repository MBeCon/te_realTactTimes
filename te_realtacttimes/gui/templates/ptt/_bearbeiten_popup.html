<div class="modal-backdrop" onclick="if(event.target===this) pttSchliesseBearbeitenPopup()">
    <div class="modal-box">
        <div class="modal-header">
            <span>PTT ändern</span>
            <span class="modal-close" onclick="pttSchliesseBearbeitenPopup()">&#10005;</span>
        </div>
        <div class="modal-body">
            {% if not row %}
            <p class="text-error">
                {% if error %}PTT-Eintrag konnte nicht geladen werden: {{ error }}{% else %}Dieser PTT-Eintrag wurde nicht gefunden (evtl. inzwischen gelöscht).{% endif %}
            </p>
            <div class="form-actions">
                <button type="button" class="btn" onclick="pttSchliesseBearbeitenPopup()">Schließen</button>
            </div>
            {% else %}
            <form method="POST" action="{{ url_for('ptt.speichern') }}">
                <input type="hidden" name="projNr" value="{{ row.projNr }}">
                <input type="hidden" name="process" value="{{ row.process }}">
                <input type="hidden" name="subProcess" value="{{ row.subProcess }}">
                <div class="form-field">
                    <label class="field-label">Projektnummer</label>
                    <input type="text" value="{{ row.projNr }}" disabled>
                </div>
                <div class="form-field">
                    <label class="field-label">Prozess</label>
                    <input type="text" value="{{ row.process }}" disabled>
                </div>
                <div class="form-field">
                    <label class="field-label">Subprozess</label>
                    <input type="text" value="{{ row.subProcess }}" disabled>
                </div>
                <div class="form-field">
                    <label class="field-label" for="ptt_bearbeiten_value">PTT (min)</label>
                    <input type="text" id="ptt_bearbeiten_value" name="ptt" value="{{ row.ptt|komma(4) }}" required autofocus>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Speichern</button>
                    <button type="button" class="btn" onclick="pttSchliesseBearbeitenPopup()">Abbrechen</button>
                </div>
            </form>
            {% endif %}
        </div>
    </div>
</div>
